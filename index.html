<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f8f5"><meta name="color-scheme" content="light dark">
  <meta name="description" content="AniDash — discover anime, save your watchlist and continue watching on phone, tablet and desktop.">
  <meta name="application-name" content="AniDash"><meta name="apple-mobile-web-app-title" content="AniDash">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/anidash-icon.png"><link rel="apple-touch-icon" href="/icons/anidash-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=11"><link rel="stylesheet" href="/android-ui.css?v=3"><link rel="stylesheet" href="/preferences.css?v=1"><link rel="stylesheet" href="/app-parity.css?v=2"><link rel="stylesheet" href="/unslop.css?v=1"><link rel="stylesheet" href="/native-parity.css?v=1"><link rel="stylesheet" href="/catalog-polish.css?v=1"><link rel="stylesheet" href="/premium-desktop.css?v=1"><title>AniDash — Anime, without the noise</title>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/home" aria-label="AniDash home"><span class="brand-mark"><img src="/icons/anidash-icon.png" alt=""></span><span class="brand-word">Ani<span>Dash</span></span></a>
      <div class="side-label">DISCOVER</div>
      <nav class="side-nav" aria-label="Main navigation">
        <a href="/home" data-route="/home" title="Home"><span class="nav-icon"><svg class="ui-icon"><use href="/icons/ui-sprite.svg#home"/></svg></span><span>Home</span></a>
        <a href="/discover" data-route="/discover" title="Discover"><span class="nav-icon"><svg class="ui-icon"><use href="/icons/ui-sprite.svg#compass"/></svg></span><span>Discover</span></a><a href="/manga" data-route="/manga" title="Manga" data-optional-manga hidden><span class="nav-icon"><svg class="ui-icon"><use href="/icons/ui-sprite.svg#manga"/></svg></span><span>Manga</span></a>
        
      </nav>
      <div class="side-label side-label-spaced">YOUR SPACE</div>
      <nav class="side-nav" aria-label="Your library">
        <a href="/library" data-route="/library" title="Your library"><span class="nav-icon"><svg class="ui-icon"><use href="/icons/ui-sprite.svg#library"/></svg></span><span>Your Library</span></a>
        <a href="/account" data-route="/account" title="My account"><span class="nav-icon"><svg class="ui-icon"><use href="/icons/ui-sprite.svg#user"/></svg></span><span>My account</span></a>
      </nav>
      <div class="sidebar-bottom">
        
        <a href="/settings" class="settings-link" data-route="/settings" title="Settings"><span class="nav-icon"><svg class="ui-icon"><use href="/icons/ui-sprite.svg#settings"/></svg></span> Settings</a>
        <div class="sidebar-foot">ANIDASH WEB <span>•</span> BETA</div>
      </div>
    </aside>
    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-brand" data-route="/home" aria-label="AniDash home"><span class="brand-mark"><img src="/icons/anidash-icon.png" alt=""></span><b>Ani<span>Dash</span></b></button>
        <div class="topbar-search" role="search"><span class="search-glyph"><svg class="ui-icon"><use href="/icons/ui-sprite.svg#search"/></svg></span><input id="global-search" type="search" placeholder="Search anime, characters, genres..." autocomplete="off" aria-label="Search anime"><kbd>ENTER</kbd></div>
        <div class="topbar-actions"><button class="icon-button install-button" data-install title="Install AniDash" aria-label="Install AniDash"><svg class="ui-icon"><use href="/icons/ui-sprite.svg#download"/></svg></button><button class="profile-chip" data-route="/account" title="Sign in or view profile"><span class="profile-avatar">A</span><span class="profile-name">Guest</span><span class="chevron">⌄</span></button></div>
      </header>
      <div id="view" class="view-content" aria-live="polite"><section class="page-skeleton" role="status" aria-label="Loading content"><div class="skeleton-line medium"></div><div class="skeleton-hero"></div><div class="skeleton-line short"></div></section></div>
      <footer class="desktop-footer"><span>AniDash Web</span><span>Anime metadata powered by AniList</span><a href="https://anilist.co" target="_blank" rel="noopener">AniList ↗</a></footer>
    </main>
  </div>
  <nav class="mobile-dock" aria-label="Mobile navigation">
    <a href="/home" data-route="/home" aria-label="Home"><span><svg class="ui-icon"><use href="/icons/ui-sprite.svg#home"/></svg></span>Home</a>
    <a href="/discover" data-route="/discover" aria-label="Discover"><span><svg class="ui-icon"><use href="/icons/ui-sprite.svg#compass"/></svg></span>Discover</a>
    <a href="/library" data-route="/library" aria-label="Library"><span><svg class="ui-icon"><use href="/icons/ui-sprite.svg#library"/></svg></span>Library</a>
    <a href="/manga" data-route="/manga" data-optional-manga aria-label="Manga" hidden><span><svg class="ui-icon"><use href="/icons/ui-sprite.svg#manga"/></svg></span>Manga</a>
  </nav>
  <div id="modal-root"></div><div id="toast-root" class="toast-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script><script src="/library-storage.js?v=2" defer></script><script src="/anilist-account.js?v=1" defer></script><script src="/mal-account.js?v=1" defer></script><script src="/cbz-reader.js?v=2" defer></script><script src="/episode-arcs.js?v=1" defer></script><script src="/app.js?v=27" defer></script>
</body></html>
