<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f8f5"><meta name="color-scheme" content="light dark">
  <meta name="description" content="AniDash — discover anime, save your watchlist and continue watching on phone, tablet and desktop.">
  <meta name="application-name" content="AniDash"><meta name="apple-mobile-web-app-title" content="AniDash">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/anidash-icon.png"><link rel="apple-touch-icon" href="/icons/anidash-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=11"><link rel="stylesheet" href="/android-ui.css?v=3"><link rel="stylesheet" href="/preferences.css?v=1"><title>AniDash — Anime, without the noise</title>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/home" aria-label="AniDash home"><span class="brand-mark"><img src="/icons/anidash-icon.png" alt=""></span><span class="brand-word">Ani<span>Dash</span></span></a>
      <div class="side-label">DISCOVER</div>
      <nav class="side-nav" aria-label="Main navigation">
        <a href="#/home" data-route="/home"><span class="nav-icon">⌂</span><span>Home</span></a>
        <a href="#/discover" data-route="/discover"><span class="nav-icon">◈</span><span>Discover</span></a>
        <a href="#/search" data-route="/search"><span class="nav-icon">⌕</span><span>Search anime</span></a>
      </nav>
      <div class="side-label side-label-spaced">YOUR SPACE</div>
      <nav class="side-nav" aria-label="Your library">
        <a href="#/library" data-route="/library"><span class="nav-icon">♡</span><span>My watchlist</span></a>
        <a href="#/account" data-route="/account"><span class="nav-icon">◎</span><span>My account</span></a>
      </nav>
      <div class="sidebar-bottom">
        
        <a href="#/settings" class="settings-link" data-route="/settings"><span class="nav-icon">⚙</span> Settings</a>
        <div class="sidebar-foot">ANIDASH WEB <span>•</span> BETA</div>
      </div>
    </aside>
    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-brand" data-route="/home" aria-label="AniDash home"><span class="brand-mark"><img src="/icons/anidash-icon.png" alt=""></span><b>Ani<span>Dash</span></b></button>
        <div class="topbar-search" role="search"><span class="search-glyph">⌕</span><input id="global-search" type="search" placeholder="Search anime, characters, genres..." autocomplete="off" aria-label="Search anime"><kbd>ENTER</kbd></div>
        <div class="topbar-actions"><button class="icon-button install-button" data-install title="Install AniDash" aria-label="Install AniDash">⇩</button><button class="profile-chip" data-route="/account" title="Sign in or view profile"><span class="profile-avatar">A</span><span class="profile-name">Guest</span><span class="chevron">⌄</span></button></div>
      </header>
      <div id="view" class="view-content" aria-live="polite"><section class="loading-state"><div class="loader"></div><p>Opening your anime universe…</p></section></div>
      <footer class="desktop-footer"><span>AniDash Web</span><span>Anime metadata powered by AniList</span><a href="https://anilist.co" target="_blank" rel="noopener">AniList ↗</a></footer>
    </main>
  </div>
  <nav class="mobile-dock" aria-label="Mobile navigation">
    <a href="#/home" data-route="/home" aria-label="Home"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span>Home</a>
    <a href="#/discover" data-route="/discover" aria-label="Discover"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m17 17 4 4"/></svg></span>Discover</a>
    <a href="#/search" data-route="/search" aria-label="Search"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><path d="M8 4v6M16 14v6"/></svg></span>Search</a>
    <a href="#/library" data-route="/library" aria-label="Library"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>Library</a>
    <a href="#/account" data-route="/account" aria-label="Account"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span>Account</a>
  </nav>
  <div id="modal-root"></div><div id="toast-root" class="toast-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script src="/library-storage.js?v=1" defer></script><script src="/anilist-account.js?v=1" defer></script><script src="/app.js?v=15" defer></script>
</body></html>
