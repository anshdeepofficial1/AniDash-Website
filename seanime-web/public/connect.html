<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>AniDash device pairing</title><style>body{background:#0c0c0c;color:white;font:16px system-ui;padding:24px;max-width:520px;margin:60px auto}code{display:block;overflow-wrap:anywhere;padding:16px;background:#252525;border-radius:8px}a{color:#94caff}</style></head><body><h1>Connect with AniDash</h1><p>Open AniDash Android → Settings → Devices and scan the original QR or enter this code. Approve only a device you recognize.</p><code id="code"></code><p>This page cannot approve a connection. No account credentials are needed here.</p><a href="/settings?tab=profile">Back to AniDash Go</a><script>const c=new URLSearchParams(location.search).get("code");document.getElementById("code").textContent=/^[0-9a-f]{32}$/.test(c||"")?c:"Invalid or missing code";history.replaceState(null,"","/connect");</script></body></html>
