        body {
            background-color: #0c0c0c;
        }
    </style>
    <script>
    // Run before the app bundles so legacy installed PWAs stop serving old HTML.
    (function () {
      if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (r) {
          var worker = r.active || r.waiting || r.installing;
          if (worker && new URL(worker.scriptURL).origin === location.origin && new URL(worker.scriptURL).pathname === "/sw.js") r.unregister().catch(function () {});
        });
      }).catch(function () {});
      if ("caches" in window) caches.keys().then(function (keys) {
        return Promise.all(keys.filter(function(k){return k.indexOf("anidash-watch-shell-")===0;}).map(function(k){return caches.delete(k);}));
      }).catch(function () {});
    })();
    </script>
</head>

<body>
<div id="root"></div>
<!-- <script type="module" src="/src/main.tsx"></script> -->
<script src="/library-storage.js" defer></script><script src="/anilist-account.js" defer></script><script src="/mal-account.js" defer></script>
<script>
/* AniList returns to whatever Redirect URL is registered (often "/") with the token in the URL hash.
   Capture it on any page, not only on /auth/callback, then open the profile page. */
document.addEventListener("DOMContentLoaded",function(){
  if(!/^#(?:\/?|\?)access_token=/.test(String(location.hash||"")))return;
  var a=window.AniDashAccount;
  var go=function(){location.replace("/settings?tab=profile")};
  if(!a){go();return}
  var r=a.captureRedirect();
  if(r==="success"){Promise.resolve(a.init()).then(go,go)}else{go()}
});
</script></body>
