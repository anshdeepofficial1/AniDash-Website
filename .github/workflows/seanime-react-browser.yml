name: Seanime React browser build
on:
  push:
    branches: [main]
    paths: ['seanime-web/**','api/episode-metadata.js','scripts/package-browser.mjs','vercel.json']
  pull_request:
    branches: [main]
    paths: ['seanime-web/**','scripts/package-browser.mjs','vercel.json']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd seanime-web && npm ci && npx rsbuild build
      - run: node scripts/package-browser.mjs
      - run: test -f seanime-web/out/index.html && grep -q AniDash seanime-web/out/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: anidash-react-browser
          path: seanime-web/out
