name: Validate JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check anilist-account.js
          node --check mal-account.js
          node --check cbz-reader.js
          node --check library-storage.js
          node --check api/auth-config.js
          node --check api/mal-config.js
          node --check api/mal-token.js
          node --check api/mal-data.js
          node --check sw.js
          node --check api/justanime.js
          node --check api/hianime.js
          node --check api/anikoto.js
          node --check api/media.js
          node --check api/episode-map.js
          node --check api/catalog.js
          node --check episode-arcs.js
          node --test tests/provider-smoke.test.js tests/client-ui.test.js tests/account-auth.test.js tests/cross-device-sync.test.js tests/catalog-resilience.test.js

  visual:
    name: Real-browser UI smoke
    if: github.event_name == 'pull_request'
    needs: syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check responsive pages and player controls
        run: node tests/visual-smoke.mjs
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anidash-ui-smoke
          path: test-artifacts/*.png
          if-no-files-found: ignore
