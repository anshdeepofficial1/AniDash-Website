name: Validate JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check api/justanime.js
          node --check api/hianime.js
          node --check api/anikoto.js
          node --check api/media.js
          node --check api/episode-map.js
